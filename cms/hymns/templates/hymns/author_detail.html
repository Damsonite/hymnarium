{% extends "hymns/base.html" %}

{% block title %}Author Detail | Hymnarium CMS{% endblock %}

{% block content %}
<h2>Author: {{ object.name }}</h2>
<p><strong>ID:</strong> {{ object.id }}</p>
<p>
    <a href="{% url 'hymns:author-update' object.pk %}">Edit</a>
    <a href="{% url 'hymns:author-delete' object.pk %}">Delete</a>
</p>
{% endblock %}
