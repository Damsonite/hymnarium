{% extends "hymns/base.html" %} {% block title %}Topics | Hymnarium CMS{%
endblock %} {% block content %}
<div class="flex flex-wrap items-center justify-between gap-3">
  <h2>Topics</h2>
  <a class="btn-primary" href="{% url 'hymns:topic-create' %}">Create Topic</a>
</div>
<table class="data-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for topic in object_list %}
    <tr>
      <td>{{ topic.id }}</td>
      <td>
        <a class="text-link" href="{% url 'hymns:topic-detail' topic.pk %}"
          >{{ topic.name }}</a
        >
      </td>
      <td>
        <div class="inline-actions">
          <a class="btn-muted" href="{% url 'hymns:topic-update' topic.pk %}"
            >Edit</a
          >
          <a class="btn-danger" href="{% url 'hymns:topic-delete' topic.pk %}"
            >Delete</a
          >
        </div>
      </td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="3">No topics found.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
