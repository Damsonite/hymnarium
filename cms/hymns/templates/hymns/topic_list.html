{% extends "hymns/base.html" %}

{% block title %}Topics | Hymnarium CMS{% endblock %}

{% block content %}
<h2>Topics</h2>
<p><a href="{% url 'hymns:topic-create' %}">Create Topic</a></p>
<table>
    <tr><th>ID</th><th>Name</th><th>Actions</th></tr>
    {% for topic in object_list %}
    <tr>
        <td>{{ topic.id }}</td>
        <td><a href="{% url 'hymns:topic-detail' topic.pk %}">{{ topic.name }}</a></td>
        <td class="actions">
            <a href="{% url 'hymns:topic-update' topic.pk %}">Edit</a>
            <a href="{% url 'hymns:topic-delete' topic.pk %}">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No topics found.</td></tr>
    {% endfor %}
</table>
{% endblock %}
