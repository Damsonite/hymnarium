{% extends "hymns/base.html" %}

{% block title %}Delete | Hymnarium CMS{% endblock %}

{% block content %}
<h2>Confirm Delete</h2>
<p>Are you sure you want to delete: <strong>{{ object }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
</form>
<p><a href="javascript:history.back()">Cancel</a></p>
{% endblock %}
