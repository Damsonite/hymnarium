{% extends "hymns/base.html" %}

{% block title %}Form | Hymnarium CMS{% endblock %}

{% block content %}
<h2>{{ view.model._meta.verbose_name|title }} Form</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
<p><a href="javascript:history.back()">Cancel</a></p>
{% endblock %}
