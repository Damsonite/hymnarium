{% extends "hymns/base.html" %} {% block title %}Authors | Hymnarium CMS{%
endblock %} {% block content %}
<div class="flex flex-wrap items-center justify-between gap-3">
  <h2>Authors</h2>
  <a class="btn-primary" href="{% url 'hymns:author-create' %}"
    >Create Author</a
  >
</div>
<table class="data-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for author in object_list %}
    <tr>
      <td>{{ author.id }}</td>
      <td>
        <a class="text-link" href="{% url 'hymns:author-detail' author.pk %}"
          >{{ author.name }}</a
        >
      </td>
      <td>
        <div class="inline-actions">
          <a class="btn-muted" href="{% url 'hymns:author-update' author.pk %}"
            >Edit</a
          >
          <a class="btn-danger" href="{% url 'hymns:author-delete' author.pk %}"
            >Delete</a
          >
        </div>
      </td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="3">No authors found.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
