{% extends "hymns/base.html" %}

{% block title %}Authors | Hymnarium CMS{% endblock %}

{% block content %}
<h2>Authors</h2>
<p><a href="{% url 'hymns:author-create' %}">Create Author</a></p>
<table>
    <tr><th>ID</th><th>Name</th><th>Actions</th></tr>
    {% for author in object_list %}
    <tr>
        <td>{{ author.id }}</td>
        <td><a href="{% url 'hymns:author-detail' author.pk %}">{{ author.name }}</a></td>
        <td class="actions">
            <a href="{% url 'hymns:author-update' author.pk %}">Edit</a>
            <a href="{% url 'hymns:author-delete' author.pk %}">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No authors found.</td></tr>
    {% endfor %}
</table>
{% endblock %}
