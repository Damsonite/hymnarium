<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hymnarium CMS{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        nav a { margin-right: 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
        .actions a { margin-right: 0.5rem; }
        form p { margin-bottom: 0.75rem; }
    </style>
</head>
<body>
    <header>
        <h1>Hymnarium CMS</h1>
        <nav>
            <a href="{% url 'hymns:home' %}">Home</a>
            <a href="{% url 'hymns:author-list' %}">Authors</a>
            <a href="{% url 'hymns:topic-list' %}">Topics</a>
            <a href="{% url 'hymns:hymn-list' %}">Hymns</a>
            <a href="{% url 'hymns:hymntranslation-list' %}">Translations</a>
            <a href="/admin/">Admin</a>
        </nav>
        <hr>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
